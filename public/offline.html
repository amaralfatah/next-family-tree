<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <title>Sedang offline · Sararia Family Tree</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --bg: #faf9f5;
        --fg: #141413;
        --muted: #6c6a64;
        --border: #e6dfd8;
        --card: #fdfcf9;
        --soga: #cc785c;
        --wordmark: #1d1d1f;
      }
      html.dark {
        color-scheme: dark;
        --bg: #1f1e1d;
        --fg: #faf9f5;
        --muted: #a6a299;
        --border: #3a3935;
        --card: #2a2927;
        --soga: #d97757;
        --wordmark: #ffffff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 26rem;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4em;
        font-size: 17px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: var(--wordmark);
      }
      .wordmark svg {
        width: 1.15em;
        height: 1.15em;
        flex-shrink: 0;
      }
      h1 {
        margin-top: 2rem;
        font-family: "Source Serif 4", "Tiempos Headline", Georgia, serif;
        font-size: 2.125rem;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 0.5rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.25rem;
        padding: 0 1rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      button:hover {
        background: color-mix(in srgb, var(--fg) 5%, var(--card));
      }
      button:focus-visible {
        outline: 2px solid var(--soga);
        outline-offset: 2px;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", d);
          var meta = document.querySelector("meta[name=theme-color]");
          if (meta) meta.setAttribute("content", d ? "#1f1e1d" : "#faf9f5");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main id="content" class="wrap">
      <span class="wordmark">
        <svg viewBox="14.5 14.5 71 71" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
          <path d="M47.4 61.33A34.4 22.8 0 1 1 52.6 61.33L52.6 51.71L63.93 42.21A2.6 2.6 0 1 0 60.59 38.22L50 47.11L39.41 38.22A2.6 2.6 0 0 0 36.07 42.21L47.4 51.71Z" />
          <path d="M42.8 84.4L44.16 66.29A39.6 28 0 0 0 55.84 66.29L57.2 84.4Z" fill="#c46b39" stroke="#c46b39" />
        </svg>
        <span>Family Tree</span>
      </span>
      <h1 id="title">Tidak ada koneksi internet</h1>
      <p id="message">Koneksi sedang terputus. Data Anda aman—silakan coba lagi saat tersambung kembali.</p>
      <button id="retry" type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
    <script>
      (function () {
        var isEn =
          location.pathname.indexOf("/en") === 0 ||
          /(?:^|;\s*)NEXT_LOCALE=en(?:;|$)/.test(document.cookie);
        if (isEn) {
          document.documentElement.lang = "en";
          document.title = "Offline · Sararia Family Tree";
          document.getElementById("title").textContent = "You are offline";
          document.getElementById("message").textContent =
            "Your internet connection appears to be offline. Your data is safe—please try again once reconnected.";
          document.getElementById("retry").textContent = "Try again";
        }
        window.addEventListener("online", function () {
          window.location.reload();
        });
      })();
    </script>
  </body>
</html>
